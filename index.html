<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitPulse - Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: "Kanit", sans-serif;
    background: #07110e;
    color: white;
    overflow: hidden;
}

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(93,255,176,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(93,255,176,0.035) 1px, transparent 1px);
    background-size: 45px 45px;
}

.glow {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(100px);
    background: rgba(50,255,160,0.08);
}

.glow-1 {
    top: -180px;
    right: -100px;
}

.glow-2 {
    bottom: -200px;
    left: -120px;
}

.login-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.login-card {
    width: 430px;
    padding: 42px;
    background: rgba(12,25,21,0.94);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    box-shadow:
        0 30px 80px rgba(0,0,0,0.65),
        0 0 80px rgba(93,255,176,0.04);
    backdrop-filter: blur(20px);
    animation: appear 0.7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    font-family: "Orbitron", sans-serif;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span:last-child {
    color: #5dffb0;
}

.logo-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 8px;
    border-radius: 50%;
    background: #5dffb0;
    box-shadow: 0 0 15px #5dffb0;
}

.subtitle {
    text-align: center;
    color: #5dffb0;
    font-size: 9px;
    letter-spacing: 4px;
    margin-top: 8px;
}

.login-icon {
    width: 75px;
    height: 75px;
    margin: 28px auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    border-radius: 22px;
    background: linear-gradient(145deg,#12251e,#0a1713);
    border: 1px solid rgba(93,255,176,0.25);
    box-shadow: 0 0 35px rgba(93,255,176,0.08);
}

.login-card h1 {
    text-align: center;
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 5px;
}

.welcome {
    text-align: center;
    color: #71847c;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 28px;
}

.input-group {
    margin-bottom: 18px;
}

.input-group label {
    display: block;
    color: #b9c8c2;
    font-size: 13px;
    margin-bottom: 8px;
}

.input-box {
    display: flex;
    align-items: center;
    height: 52px;
    padding: 0 15px;
    border-radius: 12px;
    background: #07110e;
    border: 1px solid rgba(255,255,255,0.1);
    transition: 0.25s;
}

.input-box:focus-within {
    border-color: #5dffb0;
    box-shadow: 0 0 0 3px rgba(93,255,176,0.06);
}

.input-box span {
    margin-right: 10px;
    opacity: 0.7;
}

.input-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-family: "Kanit", sans-serif;
    font-size: 14px;
}

.input-box input::placeholder {
    color: #50635b;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 0 22px;
    font-size: 12px;
}

.remember {
    display: flex;
    gap: 7px;
    align-items: center;
    color: #70827b;
}

.remember input {
    accent-color: #5dffb0;
}

.options a,
.register a {
    color: #5dffb0;
    text-decoration: none;
}

.login-button {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: #5dffb0;
    color: #06110c;
    font-family: "Kanit", sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(93,255,176,0.15);
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 25px 0;
    color: #4e6259;
    font-size: 11px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: rgba(255,255,255,0.08);
}

.guest-button {
    width: 100%;
    height: 48px;
    border-radius: 12px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: #b2c1bb;
    font-family: "Kanit", sans-serif;
    cursor: pointer;
    transition: 0.25s;
}

.guest-button:hover {
    border-color: #5dffb055;
    color: #5dffb0;
}

.register {
    text-align: center;
    color: #62756d;
    font-size: 12px;
    margin-top: 22px;
}

.register a {
    margin-left: 4px;
}

.footer-text {
    text-align: center;
    color: #394b44;
    font-size: 9px;
    margin-top: 25px;
}

@media (max-width: 500px) {
    .login-card {
        padding: 30px 22px;
        border-radius: 22px;
    }

    .login-card h1 {
        font-size: 26px;
    }

    .logo {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="grid"></div>
</div>

<main class="login-container">

    <section class="login-card">

        <div class="logo">
            <span class="logo-dot"></span>
            FIT<span>PULSE</span>
        </div>

        <p class="subtitle">FITNESS & ENERGY TRACKER</p>

        <div class="login-icon">
            🏃
        </div>

        <h1>เข้าสู่ระบบ</h1>

        <p class="welcome">
            ยินดีต้อนรับกลับมา<br>
            พร้อมออกกำลังกายไปด้วยกันหรือยัง?
        </p>

        <form>

            <div class="input-group">
                <label for="username">ชื่อผู้ใช้</label>

                <div class="input-box">
                    <span>👤</span>
                    <input
                        type="text"
                        id="username"
                        placeholder="กรอกชื่อผู้ใช้"
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <label for="password">รหัสผ่าน</label>

                <div class="input-box">
                    <span>🔒</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="กรอกรหัสผ่าน"
                        required
                    >
                </div>
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    <span>จดจำฉัน</span>
                </label>

                <a href="#">ลืมรหัสผ่าน?</a>

            </div>

            <button type="submit" class="login-button">
                เข้าสู่ระบบ
                <span>→</span>
            </button>

        </form>

        <div class="divider">
            <span>หรือ</span>
        </div>

        <button class="guest-button">
            เข้าชมเว็บไซต์ในฐานะผู้เยี่ยมชม
        </button>

        <p class="register">
            ยังไม่มีบัญชี?
            <a href="#">สมัครสมาชิก</a>
        </p>

        <p class="footer-text">
            © 2026 FitPulse • Fitness & Energy Tracker
        </p>

    </section>

</main>

</body>
</html>
